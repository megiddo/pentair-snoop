[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentairsnoop"
version = "0.1.0"
description = "Lab CLI for Pentair RS485 protocol inspection, decode, and capture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "pentair lab" }]
dependencies = [
    "pyserial>=3.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
pentairsnoop = "pentairsnoop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pentairsnoop = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=pentairsnoop",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]

[tool.coverage.run]
source = ["pentairsnoop"]
branch = true
omit = ["*/pentairsnoop/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true
